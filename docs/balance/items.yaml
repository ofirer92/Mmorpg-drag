# Items + loot tables. roll_loot() in shared-rules reads loot_tables.
version: 1
items:
  expired_bandage:
    name_key: item.expired_bandage.name
    slot: consumable
    rarity: common
    value: 3
    stats: {attack: 0, defense: 0, hp: 15}   # consumable: hp = heal amount (RulesCombat.heal)
  # --- placeholder, game-designer replaces in T-0.7 ---
  rubber_stamp_sword:
    name_key: item.rubber_stamp_sword.name
    slot: weapon
    rarity: common
    value: 12
    stats: {attack: 4, defense: 0, hp: 0}
  triplicate_dagger:
    name_key: item.triplicate_dagger.name
    slot: weapon
    rarity: rare
    value: 30
    stats: {attack: 7, defense: 0, hp: 0}
  ethics_committee_cap:
    name_key: item.ethics_committee_cap.name
    slot: head
    rarity: common
    value: 10
    stats: {attack: 0, defense: 3, hp: 5}
  liability_waiver_robe:
    name_key: item.liability_waiver_robe.name
    slot: body
    rarity: rare
    value: 35
    stats: {attack: 0, defense: 6, hp: 15}
  placebo_pill:
    name_key: item.placebo_pill.name
    slot: consumable
    rarity: common
    value: 5
    stats: {attack: 0, defense: 0, hp: 25}   # it's a placebo. it works anyway.
  # --- end placeholder ---
  # --- placeholder batch 2 (Q5) ---
  intern_coat:
    name_key: item.intern_coat.name
    slot: body
    rarity: common
    value: 18
    stats: {attack: 0, defense: 2, hp: 10}
  hazmat_hairnet:
    name_key: item.hazmat_hairnet.name
    slot: head
    rarity: rare
    value: 40
    stats: {attack: 0, defense: 4, hp: 5}
  stapler_of_authority:
    name_key: item.stapler_of_authority.name
    slot: weapon
    rarity: rare
    value: 60
    stats: {attack: 6, defense: 0, hp: 0}
  expired_prescription:
    name_key: item.expired_prescription.name
    slot: consumable
    rarity: common
    value: 9
    stats: {attack: 0, defense: 0, hp: 40}   # heal amount
  # --- end placeholder batch 2 ---
loot_tables:
  common_trash:
    rolls: 1
    entries:
      - item: expired_bandage
        weight: 70
      - item: rubber_stamp_sword
        weight: 3
      - item: triplicate_dagger
        weight: 1
      - item: ethics_committee_cap
        weight: 3
      - item: liability_waiver_robe
        weight: 1
      - item: placebo_pill
        weight: 7
      - item: null           # nothing
        weight: 30
# ⚠️ ENGINEERING PLACEHOLDER (Q7, T-1.7): affix roll table. The roll mechanics (affix_count /
# affix_pool_size / roll_affix_id in shared-rules) are final; the specific ids/weights/values below
# are an engineering placeholder for the game-designer to tune later. Client item-instance
# integration (inventory rolls, tooltips) is a later task — this file only feeds shared-rules tests.
affixes:
  stamped:
    name_key: item.affix.stamped.name
    rarities: [common, rare, epic]
    stats: {attack: 0, defense: 0, hp: 0}
    mult: {attack: 0.03, defense: 0.0, hp: 0.0}
    weight: 20
  in_triplicate:
    name_key: item.affix.in_triplicate.name
    rarities: [rare, epic]
    stats: {attack: 0, defense: 1, hp: 0}
    mult: {attack: 0.0, defense: 0.0, hp: 0.0}
    weight: 12
  off_label:
    name_key: item.affix.off_label.name
    rarities: [common, rare, epic]
    stats: {attack: 2, defense: 0, hp: 0}
    mult: {attack: 0.0, defense: 0.0, hp: 0.0}
    weight: 18
  generic_brand:
    name_key: item.affix.generic_brand.name
    rarities: [common]
    stats: {attack: 1, defense: 1, hp: 0}
    mult: {attack: 0.0, defense: 0.0, hp: 0.0}
    weight: 25
  insured:
    name_key: item.affix.insured.name
    rarities: [rare, epic]
    stats: {attack: 0, defense: 0, hp: 10}
    mult: {attack: 0.0, defense: 0.0, hp: 0.05}
    weight: 10
  expired_but_fine:
    name_key: item.affix.expired_but_fine.name
    rarities: [common, rare]
    stats: {attack: 0, defense: 0, hp: 5}
    mult: {attack: 0.0, defense: 0.0, hp: 0.0}
    weight: 22
  committee_approved:
    name_key: item.affix.committee_approved.name
    rarities: [epic]
    stats: {attack: 3, defense: 3, hp: 0}
    mult: {attack: 0.05, defense: 0.05, hp: 0.0}
    weight: 6
  side_effects_may_include:
    name_key: item.affix.side_effects_may_include.name
    rarities: [rare, epic]
    stats: {attack: 4, defense: 0, hp: 0}
    mult: {attack: 0.0, defense: 0.0, hp: 0.0}
    weight: 9
  dosage_adjusted:
    name_key: item.affix.dosage_adjusted.name
    rarities: [common, rare, epic]
    stats: {attack: 0, defense: 0, hp: 0}
    mult: {attack: 0.0, defense: 0.08, hp: 0.0}
    weight: 14
  manager_signed:
    name_key: item.affix.manager_signed.name
    rarities: [epic]
    stats: {attack: 5, defense: 5, hp: 5}
    mult: {attack: 0.1, defense: 0.1, hp: 0.1}
    weight: 4
# Explicit roll order (RulesScript can't iterate Dictionary keys — see affixes.ts). Must list every
# key in `affixes` above exactly once.
affix_order:
  [
    stamped,
    in_triplicate,
    off_label,
    generic_brand,
    insured,
    expired_but_fine,
    committee_approved,
    side_effects_may_include,
    dosage_adjusted,
    manager_signed,
  ]
# Number of affixes rolled per rarity (inclusive min..max). Caller re-rolls on duplicate ids.
affix_slots:
  common: {min: 0, max: 1}
  rare: {min: 1, max: 2}
  epic: {min: 2, max: 3}
