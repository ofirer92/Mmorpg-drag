# Shared map data for clinic_lobby — a VERTICAL tower (20 cols × 60 rows = 640×1920px) for the
# game's portrait orientation. The layout is the single source of truth,
# copied exactly from client/scripts/maps/clinic_lobby.gd LAYOUT (client migrates to
# RulesBalanceData.MAPS later; see ADR-016 and client/tests/test_rules_maps.gd for the
# parity check). tile_size/cols/rows/spawn are px/grid values, not balance numbers, but
# they live here so server and client never disagree on the world shape.
id: clinic_lobby
tile_size: 32
cols: 20
rows: 60
spawn:
  x: 80
  y: 1870
solid_chars: ["#", "=", "W"]
# T-2.4: copied EXACTLY from client/scripts/maps/clinic_lobby.gd's MONSTER_SPAWNS — cell is [col,
# row] in the same grid as `layout` (see client/tests/test_rules_maps.gd for the parity check).
monster_spawns:
