# Fly.io config (staging/prod apps chosen by scripts/deploy.sh via FLY_APP_*).
app = "hamirpaa-staging"
primary_region = "fra"
[build]
  dockerfile = "server/Dockerfile"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1
[checks.health]
  type = "http"
  port = 8080
  path = "/health"
  interval = "15s"
  timeout = "5s"
