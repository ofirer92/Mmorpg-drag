# Dev infrastructure only. Changing this file requires an ADR in DECISIONS.md (see ADR-007).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hamirpaa
      POSTGRES_PASSWORD: hamirpaa
      POSTGRES_DB: hamirpaa
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hamirpaa"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
